<text x="991" y="50" fill="#dcd6ff" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" letter-spacing="1">RESEARCH</text>
<rect x="1071" y="202" width="93" height="27" rx="13" fill="#193e4a" stroke="#65decb" stroke-opacity=".45"/>
<text x="1117" y="220" fill="#a9fff0" font-family="Arial,Helvetica,sans-serif" font-size="12" text-anchor="middle" letter-spacing="1">BUILD</text>
<circle cx="1144" cy="46" r="6" fill="#a99af8"/>
<circle cx="1156" cy="78" r="3" fill="#65decb"/>
